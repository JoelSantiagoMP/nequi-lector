name: Build APK

on:
  push:
    branches: [ fix/version-estable ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.7' # Flet solicitó esta versión en tu log anterior

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Build APK
        run: |
          # --yes evita el EOFError y la interacción humana
          flet build apk -v --yes
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
